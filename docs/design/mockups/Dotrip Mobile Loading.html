<!DOCTYPE html>
<!--
  Dotrip 로딩 상태 정본 시안 — 모바일
  · A005 v3 §9 기준, SpotFinder 지도 로딩 UX 확정 시안 (2026-07-18)
  · 색값의 정본은 lib/theme.ts — 이 파일의 리터럴 hex는 시각 대조용 근사값
  · 셔머 바탕 = popover(#232527), 이동 띠 = surface2(#26292b) — theme.ts dark 완전 일치
  · 시각 대조 전용. 마크업 복붙 금지, 의도를 Next 16 + Tailwind v4로 재구현
  · 포맷: 수기 정적 HTML (기존 2파일은 DC 번들, 이 파일은 손으로 작성)

  로딩 규칙:
  - 로딩 프레임은 항상 거치는 장면 (지연이든 정상이든 표시 후 교체)
  - 상단 지도 영역 = 셔머 언어 + 지도핀 아이콘 / 하단 시트 목록 = 셔머 스켈레톤
  - 지도핀·라벨은 셔머와 같은 1.4s 리듬으로 breathe(투명도 0.4~0.85)
  - 시트의 검색·칩·핸들은 즉시 표시, 목록 행만 셔머
  - 각 영역은 준비되는 대로 실제 콘텐츠로 교체 (게이트 분리: 지도 슬롯만 대기)
  - 최소 표시 시간(150~300ms 지연 + 300~500ms 유지)으로 깜빡임 방지
  - 진짜 실패(SDK onerror) 시에만 지도 영역에 수동 "다시 시도" 버튼
  - 비율: 상단 지도 + 하단 시트가 걸쳐 올라온 초기 화면(실제 SpotFinder 모바일)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Dotrip Mobile Loading</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg-deep: #151718;
    --sheet: #1a1c1e;
    --fg: #f0eee8;
    --muted: #8a8d8f;
    --hint: #6a6d6f;
    --border: #2c2f31;
    --brand: #4d9eff;
    --on-brand: #04244a;
    --chip-off: #232527;
    /* 셔머 정본: 바탕=popover, 이동 띠=surface2 (lib/theme.ts dark) */
    --shimmer-base: #232527;
    --shimmer-move: #26292b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1d1f21; font-family: 'Pretendard', system-ui, sans-serif; color: var(--fg); padding: 24px; display: flex; justify-content: center; }
  .phone { width: 340px; background: var(--bg-deep); border-radius: 30px; overflow: hidden; border: 0.5px solid var(--border); }

  /* 상단 지도 영역 (셔머 언어 통일 + 지도핀 breathe) */
  .map { position: relative; height: 210px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .map i { font-size: 28px; color: #4a4e52; }
  .map .label { font-size: 13px; color: var(--hint); }

  /* 하단 시트: 지도 위로 걸쳐 올라옴 */
  .sheet { position: relative; margin-top: -14px; background: var(--sheet); border-top-left-radius: 20px; border-top-right-radius: 20px; border-top: 0.5px solid var(--border); padding: 12px 18px 16px; min-height: 280px; }
  .handle { width: 38px; height: 4px; border-radius: 2px; background: #3a3d3f; margin: 0 auto 12px; }
  .sheet-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .sheet-head .t { font-size: 14px; font-weight: 500; }
  .sheet-head .c { font-size: 11px; color: var(--muted); }
  .search { display: flex; align-items: center; gap: 6px; background: var(--chip-off); border: 0.5px solid var(--border); border-radius: 9px; padding: 9px 12px; font-size: 12px; color: var(--hint); margin-bottom: 12px; }
  .chips { display: flex; gap: 5px; margin-bottom: 16px; overflow: hidden; }
  .chip { font-size: 11px; padding: 5px 11px; border-radius: 13px; white-space: nowrap; background: var(--chip-off); color: #b4b2a9; }
  .chip.on { background: var(--brand); color: var(--on-brand); }
  .rows { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row .txt { flex: 1; }

  /* 탭바 */
  .tabbar { background: var(--bg-deep); border-top: 0.5px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 14px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
  .tab i { font-size: 18px; }
  .tab.on { color: var(--brand); }

  /* 셔머 스켈레톤 — 시안 원본 정의 (linear-gradient 100deg, 1.4s) */
  .skel {
    background: linear-gradient(100deg, var(--shimmer-base) 40%, var(--shimmer-move) 50%, var(--shimmer-base) 60%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 4px;
  }
  .thumb { width: 48px; height: 48px; border-radius: 8px; flex-shrink: 0; }
  .bar { height: 11px; margin-bottom: 7px; }
  .bar.sm { height: 9px; margin-bottom: 0; }
  /* 지도핀·라벨: 셔머와 같은 1.4s 리듬으로 숨쉼 */
  .breathe { animation: breathe 1.4s ease-in-out infinite; }

  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @keyframes breathe { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.85; } }
</style>
</head>
<body>

<!-- ==== 1. SPOTFINDER — 로딩 프레임 (모바일) ==== -->
<div class="phone">

  <!-- 상단: 지도 영역 (셔머 언어 통일 + 지도핀 breathe) -->
  <div class="map skel">
    <i class="ti ti-map-pin breathe"></i>
    <div class="label breathe">지도를 불러오는 중</div>
  </div>

  <!-- 하단: 시트 (검색·칩 즉시 / 목록 셔머) -->
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-head"><span class="t">영화·드라마 촬영지 검색</span><span class="c">총 50곳</span></div>
    <div class="search"><i class="ti ti-search"></i>작품명·촬영지를 입력하세요</div>
    <div class="chips">
      <span class="chip on">전체 (50)</span>
      <span class="chip">도깨비 (9)</span>
      <span class="chip">호텔 델루나…</span>
    </div>
    <div class="rows">
      <div class="row"><div class="skel thumb"></div><div class="txt"><div class="skel bar" style="width:70%"></div><div class="skel bar sm" style="width:52%"></div></div></div>
      <div class="row"><div class="skel thumb"></div><div class="txt"><div class="skel bar" style="width:60%"></div><div class="skel bar sm" style="width:46%"></div></div></div>
      <div class="row"><div class="skel thumb"></div><div class="txt"><div class="skel bar" style="width:66%"></div><div class="skel bar sm" style="width:50%"></div></div></div>
    </div>
  </div>

  <!-- 탭바 -->
  <div class="tabbar">
    <div class="tab"><i class="ti ti-photo"></i>Story</div>
    <div class="tab on"><i class="ti ti-map-pin"></i>SpotFinder</div>
    <div class="tab"><i class="ti ti-route"></i>PlanFinder</div>
    <div class="tab"><i class="ti ti-pencil"></i>Write</div>
  </div>

</div>

</body>
</html>
