name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts가 존재 검사만 하는 값. 빌드 시점 DB 호출 0건이라
      # 실제 연결에 쓰이지 않는다. 마이그레이션은 CI에서 실행하지 않음
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
    steps:
      # checkout이 setup-node보다 먼저 — npm 캐시 키가 lockfile 해시라 순서 의존
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
